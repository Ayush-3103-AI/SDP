[project]
name = "xqi"
version = "0.1.0"
description = "Explainable, safe human-in-the-loop correction for FFF printing"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "requests",
    "ultralytics>=8.3",
    "torch",
    "torchvision",
    "streamlit",
    "pandas",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not gpu and not hw and not slow"'
markers = [
    "gpu: needs a CUDA GPU",
    "hw: needs the real printer",
    "slow: long-running",
]
