<style>
/* Built to be read in one sitting as a story in four acts: plain paper, high contrast, a reading measure,
   no texture or blur. One accent (coral) marks what matters. Content renders from VISION; no per-project edits here. */
:root{
  --paper:#fcfbf8; --surface:#ffffff; --sunk:#f3f0ea;
  --ink:#15120f; --ink-2:#45403a; --ink-3:#6b655d; --line:#e4dfd6; --line-2:#c9c2b7;
  --coral:#e8401f; --red:#c4301a; --coral-wash:#fcefe9; --ok:#1d7a4b; --amber:#9b6708; --blue:#2457c5;
  --ease:cubic-bezier(.16,1,.3,1); --r:14px; --r-sm:10px;
  --display:"Bricolage Grotesque",Arial,sans-serif; --body:Geist,system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace; --serif:"Instrument Serif",Georgia,serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#121110; --surface:#1a1816; --sunk:#221f1c;
  --ink:#f1ece3; --ink-2:#cbc4b8; --ink-3:#9c958a; --line:#2c2925; --line-2:#433f39;
  --coral:#ff6a4f; --red:#ff7b66; --coral-wash:#2b1c17; --ok:#4ade80; --amber:#eab308; --blue:#8ab0ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:24px;-webkit-text-size-adjust:100%}
html[data-motion="off"]{scroll-behavior:auto}
body{margin:0;color:var(--ink);background:var(--paper);font:19px/1.6 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:rgba(232,64,31,.2)}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(44px,6.5vw,84px);font-weight:800;letter-spacing:-.035em}
h2{font-size:clamp(32px,4vw,52px);font-weight:800}
h3{font-size:clamp(22px,2.6vw,30px);font-weight:700}
h4{font-size:21px;font-weight:700;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0}
em.ac{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;font-size:1.06em;color:var(--red)}
.k{display:block;font:600 14px/1.3 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.mono{font-family:var(--mono)}
.big{font-family:var(--display);font-size:clamp(26px,3.2vw,40px);line-height:1.18;font-weight:700;letter-spacing:-.025em;text-wrap:balance}
.inv{display:inline-flex;align-items:center;gap:5px;font:600 14px/1 var(--body);color:var(--amber);border:1.5px solid var(--amber);border-radius:999px;padding:4px 9px;vertical-align:middle;white-space:nowrap;font-style:normal;letter-spacing:0}
.inv::before{content:"✦"}
.chip{display:inline-flex;align-items:center;font:600 15px/1 var(--body);padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);white-space:nowrap;color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}

/* shell: sticky section list on wide screens, scroll strip above */
.shell{max-width:80rem;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
@media(min-width:88rem){.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:56px;align-items:start}}
aside.side{display:none}
@media(min-width:88rem){aside.side{display:block;position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:28px 0 28px;scrollbar-width:thin}}
aside.side .brand{display:block;text-decoration:none;margin-bottom:18px}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font:500 14px/1.4 var(--body);color:var(--ink-3);display:block;margin-top:4px}
aside.side nav{display:grid;gap:1px}
aside.side nav .act-h{font:700 14px/1.2 var(--body);color:var(--ink);margin:16px 0 4px;padding:0 8px;display:flex;gap:8px;align-items:baseline}
aside.side nav .act-h i{font:500 14px var(--mono);color:var(--red);font-style:normal}
aside.side nav a{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:baseline;font:500 15px/1.3 var(--body);color:var(--ink-2);text-decoration:none;padding:5px 8px;border-radius:8px}
aside.side nav a .n{font:500 14px var(--mono);color:var(--ink-3)}
aside.side nav a:hover{background:var(--sunk);color:var(--ink)}
aside.side nav a.on{background:var(--coral-wash);color:var(--ink);font-weight:600}
aside.side nav a.on .n{color:var(--red)}
header.top{position:sticky;top:0;z-index:20;background:var(--paper);box-shadow:0 1px 0 var(--line);margin:0 -16px;padding:0 16px}
@media(min-width:88rem){header.top{display:none}}
header.top .row{display:flex;align-items:center;gap:16px;padding:10px 0}
header.top .brand b{font-size:17px;white-space:nowrap}
header.top .brand span{display:none}
.toc{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font:500 15px/1 var(--body);padding:9px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);white-space:nowrap}
.toc a.on{background:var(--coral-wash);color:var(--ink);font-weight:600}
main{min-width:0;padding-bottom:40px}
.ctl{position:fixed;right:16px;bottom:16px;z-index:30;display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);box-shadow:0 8px 24px -12px rgba(0,0,0,.25)}
.ctl button{all:unset;cursor:pointer;min-width:44px;min-height:40px;padding:0 14px;border-radius:999px;font:500 14px var(--body);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center}
.ctl button[aria-pressed="true"]{background:var(--sunk);color:var(--ink)}
.ctl button:hover{color:var(--ink)}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px}

/* acts and sections */
.act{margin-top:88px;padding-top:28px;border-top:3px solid var(--ink);display:grid;gap:10px;scroll-margin-top:24px}
.act .n{font:600 15px/1 var(--body);color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.act h2{font-size:clamp(36px,5vw,66px);letter-spacing:-.03em}
.act p{font-size:20px;line-height:1.5;color:var(--ink-2);max-width:62ch}
section.s{padding:56px 0 8px;scroll-margin-top:24px;border-top:1px solid var(--line);margin-top:40px}
.act+section.s{border-top:0;margin-top:0;padding-top:44px}
.sec-head{display:grid;gap:10px;margin-bottom:26px}
.sec-head .eyebrow{display:flex;gap:12px;align-items:baseline;font:600 15px/1 var(--body);color:var(--ink-3)}
.sec-head .eyebrow .n{font:500 15px var(--mono);color:var(--red)}
.sec-head .lede{font-size:18px;line-height:1.5;color:var(--ink-3);max-width:68ch}

/* hero + at a glance */
.hero{padding:40px 0 8px}
@media(min-width:64rem){.hero{padding:64px 0 8px}}
.hero .eyebrow{font:600 15px/1 var(--body);color:var(--ink-3);display:flex;gap:10px;align-items:center}
.hero .eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--coral);display:inline-block}
.hero h1{margin-top:16px}
.hero .line{margin-top:20px;max-width:30ch}
.two-years{margin-top:22px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;font-size:20px;line-height:1.5;color:var(--ink-2);max-width:72ch}
.two-years .k{color:var(--red)}
.glance{margin-top:40px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.glance .cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:8px;align-content:start}
.glance .cell.wide{grid-column:1/-1}
.glance .cell p{font-size:18px;line-height:1.45}
.glance .cell .v{font-family:var(--display);font-size:clamp(32px,4vw,48px);font-weight:800;letter-spacing:-.03em;line-height:1}
.glance .cell.hot{background:var(--coral-wash);border-color:rgba(232,64,31,.3)}
.glance .cell.dark{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.glance .cell.dark .k{color:var(--paper);opacity:.75}
.glance .cell ul{padding:0;list-style:none;display:grid;gap:6px;font-size:17px}
.glance .cell li::before{content:"·";color:var(--red);margin-right:8px;font-weight:700}
.glance-title{margin-top:44px;display:flex;align-items:baseline;gap:12px}
.glance-title h3{font-size:22px}
.glance-title span{font-size:16px;color:var(--ink-3)}
.isnot{display:grid;gap:14px;margin-top:14px}
@media(min-width:48rem){.isnot{grid-template-columns:1fr 1fr}}
.isnot div{padding:18px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.isnot ul{padding:0;list-style:none;display:grid;gap:8px;font-size:18px;margin-top:8px}
.isnot li{padding-left:24px;position:relative}
.isnot li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
.isnot .no li::before{content:"✕";color:var(--red)}

/* H problem, atomised */
.prob .bigp{padding:26px 28px;border-radius:var(--r);background:var(--ink);color:var(--paper)}
.prob .bigp .k{color:var(--paper);opacity:.75}
.prob .bigp p{margin-top:8px}
.prob .tally{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:18px 0 14px;font-size:16px;color:var(--ink-2)}
.prob .tally b{font-family:var(--display);font-size:26px;letter-spacing:-.02em;color:var(--ink)}
.units{display:grid;gap:10px}
.unit{display:grid;gap:12px;padding:18px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);grid-template-columns:auto minmax(0,1fr)}
@media(min-width:64rem){.unit{grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) 190px}}
.unit .num{font-family:var(--display);font-size:28px;font-weight:800;color:var(--red);line-height:1;letter-spacing:-.03em}
.unit h4{font-size:20px}
.unit .today{font-size:16.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}
.unit .sol{font-size:17.5px;line-height:1.5}
.unit .why{font-size:16px;color:var(--ink-2);margin-top:6px;line-height:1.45}
.unit .sol-wrap{grid-column:2}
@media(min-width:64rem){.unit .sol-wrap{grid-column:auto}}
.unit.new{border-color:rgba(232,64,31,.35)}
.nov{display:grid;gap:6px;align-content:start;grid-column:2}
@media(min-width:64rem){.nov{grid-column:auto}}
.nov .dots{display:flex;gap:4px}
.nov .dots i{width:24px;height:9px;border-radius:5px;background:var(--line)}
.nov.standard .dots i:nth-child(1){background:var(--ink-3)}
.nov.adapted .dots i:nth-child(-n+2){background:var(--amber)}
.nov.new .dots i{background:var(--coral)}
.nov .lbl{font:600 14px/1.3 var(--body);color:var(--ink-2)}
.nov.new .lbl{color:var(--red)}

/* 2 press release */
.pr{display:grid;gap:22px}
@media(min-width:64rem){.pr{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}}
.pr .paper{padding:30px 32px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.pr .date{font:500 15px var(--mono);color:var(--ink-3)}
.pr h3{margin-top:10px;font-size:clamp(26px,3.2vw,38px)}
.pr .sub{margin-top:12px;font-size:20px;color:var(--ink-2);line-height:1.45}
.pr .body{margin-top:22px;display:grid;gap:14px;font-size:18.5px;line-height:1.6;max-width:68ch}
.pr .body p:first-child::first-letter{font-family:var(--display);font-size:3.2em;line-height:.8;float:left;padding:6px 10px 0 0;color:var(--red);font-weight:800}
.quotes{display:grid;gap:14px;align-content:start}
.quote{padding:22px 24px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.quote p{font-family:var(--serif);font-size:clamp(21px,2.2vw,26px);line-height:1.3;font-style:italic}
.quote .k{margin-top:12px}

/* 3 magic + loop + ladder */
.magic{display:grid;gap:18px}
@media(min-width:64rem){.magic{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.magic .moment{padding:26px 28px;background:var(--coral-wash);border:1px solid rgba(232,64,31,.3);border-radius:var(--r)}
.magic .moment .big{margin-top:10px}
.loop{display:grid;place-items:center}
.loop svg{width:100%;max-width:320px;height:auto}
.loop text{font:600 15px var(--body);fill:var(--ink)}
.loop .ring{fill:none;stroke:var(--coral);stroke-width:3;stroke-dasharray:10 8;animation:flow 1.05s linear infinite}
.loop .node{fill:var(--surface);stroke:var(--line-2);stroke-width:1.5}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
html[data-motion="off"] *{animation:none!important}
.ladder{margin-top:22px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:60rem){.ladder{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
.ladder div{padding:14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:16px;line-height:1.4;min-height:140px;display:flex;flex-direction:column;gap:8px}
.ladder .star{font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink-3)}
.ladder .target{border:2px solid var(--coral);background:var(--coral-wash)}
.ladder .target .star{color:var(--red)}
.ladder .target .star::after{content:"build this";display:block;font:600 14px/1.2 var(--body);margin-top:2px}

/* 4 personas, A ideal user, G people */
.persona,.person{display:grid;gap:10px;align-content:start}
.persona.anti{border:2px dashed var(--red)}
.role{display:flex;justify-content:space-between;align-items:center;gap:8px}
.persona h4,.person h4{font-size:22px}
.persona dl,.person dl{margin:0;display:grid;gap:6px}
.persona dt,.person dt{font:600 14px/1.3 var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin-top:4px}
.persona dd,.person dd{margin:0;font-size:17px;line-height:1.5}
.person .why{font-size:17px;color:var(--ink-2);line-height:1.5}
.person dd ul{padding-left:18px;display:grid;gap:4px}
.ideal{display:grid;gap:14px}
@media(min-width:64rem){.ideal{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr)}}
.ideal .portrait{display:grid;gap:12px;align-content:start}
.ideal .says{font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.3vw,27px);color:var(--red);line-height:1.3}
.ideal ul{padding:0;list-style:none;display:grid;gap:9px;font-size:17.5px;margin-top:8px}
.ideal li{padding-left:26px;position:relative;line-height:1.45}
.ideal .was li{color:var(--ink-2)}
.ideal .was li::before{content:"–";position:absolute;left:0;color:var(--ink-3);font-weight:700}
.ideal .now li::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}

/* 5 jobs */
.jobs{display:grid;gap:10px}
.job{display:grid;gap:10px;padding:18px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.job .row{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:14px}
.job .rank{font-family:var(--display);font-size:30px;font-weight:800;color:var(--red);line-height:1}
.job .story{font-size:clamp(18px,1.9vw,21px);line-height:1.4}
.bar{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--coral);transform-origin:left}
.job.emotional .bar i{background:var(--amber)}.job.social .bar i{background:var(--blue)}
.job .type{font:600 14px var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}

/* 6 day (today in act I, finished in act II) */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 12px;scrollbar-width:thin}
.frame{scroll-snap-align:start;padding:16px 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto 1fr;gap:10px;min-height:170px}
.frame .t{font:500 15px var(--mono);color:var(--ink-3);display:flex;justify-content:space-between;align-items:center}
.frame svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.frame p{font-size:17px;line-height:1.45}
.strip.before .frame{background:var(--sunk);border-color:transparent}
.strip.after .frame .t{color:var(--red)}
.strip.after .frame.hit{background:var(--coral-wash);border-color:rgba(232,64,31,.3)}
.strip-note{font-size:16px;color:var(--ink-3);margin-top:6px}

/* C first minutes */
.fm{display:grid;max-width:68ch}
.fm .step{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.fm .step:first-child{border-top:0}
.fm .t{font:500 22px var(--mono);color:var(--ink-3)}
.fm .step p{font-size:19px;line-height:1.45}
.fm .step.magic{background:var(--coral-wash);border-radius:var(--r);padding:16px 18px;margin:6px -18px;border-top:0}
.fm .step.magic .t{color:var(--red)}
.fm .step.magic p::after{content:" ← the magic moment";font:600 14px var(--body);color:var(--red);white-space:nowrap}

/* 7 use cases */
details.uc{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px}
details.uc>summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:baseline;padding:18px 22px}
details.uc>summary::-webkit-details-marker{display:none}
details.uc>summary .id{font:500 15px var(--mono);color:var(--red)}
details.uc>summary .st{font:600 19px/1.35 var(--display);letter-spacing:-.01em}
details.uc>summary::after{content:"+";font:700 22px var(--mono);color:var(--red)}
details.uc[open]>summary::after{content:"−"}
.uc-body{display:grid;gap:18px;padding:0 22px 22px}
@media(min-width:48rem){.uc-body{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.uc-body p{font-size:17.5px;line-height:1.5}
.uc-body ol{margin-top:6px;padding-left:22px;display:grid;gap:5px;font-size:17.5px}
.uc-body .k{margin-top:12px;margin-bottom:4px}
.uc-body .fail{border-left:4px solid var(--red);padding:10px 14px;background:var(--coral-wash);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:16.5px}
.uc-body .fail ul{margin-top:6px;padding-left:18px}

/* 8 surfaces */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{all:unset;cursor:pointer;font:600 15px var(--body);padding:10px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);min-height:42px;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tabs .kind{font:500 14px var(--body);opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.screens{display:grid;gap:14px}
.screens[hidden]{display:none}
@media(min-width:48rem){.screens{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
.screen{padding:18px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.screen h4{margin-bottom:12px}
.bb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:8px;border-radius:var(--r-sm);background:var(--sunk)}
.bb div{border:2px dashed var(--line-2);border-radius:6px;padding:10px 9px;min-height:52px;font:500 15px/1.3 var(--body);color:var(--ink-2);display:flex;align-items:flex-end;background:var(--surface)}
@media(max-width:40rem){.bb div{grid-column:span 12!important}}
.screen .note{margin-top:10px;font-size:16px;color:var(--ink-3)}

/* F physical */
.phys{display:grid;gap:14px}
@media(min-width:48rem){.phys{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.phys .cell{padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.phys .cell p,.phys .cell li{font-size:17px;line-height:1.5}
.phys ul{padding-left:18px;display:grid;gap:5px}
.phys .dims{font-family:var(--display);font-size:clamp(26px,3vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.05}

/* 9 features */
.mods{display:grid;gap:14px}
@media(min-width:48rem){.mods{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
.mod{padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.mod h4{margin-bottom:12px}
.mod ul{list-style:none;padding:0;display:grid;gap:8px}
.feat{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:17px;line-height:1.35}
.tier{font:600 14px var(--body);letter-spacing:.04em;padding:4px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.tier.core{background:var(--ink);color:var(--paper)}
.tier.complete{border:1.5px solid var(--ink-3);color:var(--ink-2)}
.tier.delight{border:1.5px dashed var(--coral);color:var(--red)}
.badge{font:600 14px var(--mono);color:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center;font-size:15px;color:var(--ink-3)}

/* E decision rights */
.dr{display:grid;gap:12px}
@media(min-width:48rem){.dr{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dr .col{padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:10px;align-content:start}
.dr h4{display:flex;align-items:center;gap:10px}
.dr h4::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none}
.dr .ask h4::before{background:var(--amber)}.dr .never h4::before{background:var(--red)}
.dr .never{border:2px dashed var(--red)}
.dr ul{padding:0;list-style:none;display:grid;gap:6px;font-size:17px;line-height:1.4}
.dr li{padding:9px 12px;border-radius:var(--r-sm);background:var(--sunk)}

/* 10 no-gos */
.nogo{list-style:none;padding:0;display:grid;gap:14px;max-width:68ch}
.nogo li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;font-family:var(--display);font-size:clamp(22px,2.6vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.2}
.nogo li::before{content:"✕";color:var(--red);font-size:.9em}
.nogo li small{display:block;font:400 17px/1.5 var(--body);color:var(--ink-2);margin-top:4px;letter-spacing:0}

/* 11 qualities */
.feels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.feels span{font-family:var(--display);font-size:clamp(20px,2.2vw,26px);font-weight:700;padding:8px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:6px}
.tile .v{font-family:var(--display);font-size:clamp(34px,4vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1}

/* B situation */
.sit{display:grid;gap:14px}
@media(min-width:48rem){.sit{grid-template-columns:1fr 1fr}}
.sit .col{padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:4px;align-content:start}
.sit .col.shine{background:var(--coral-wash);border-color:rgba(232,64,31,.3)}
.sit .col.survive{border:2px dashed var(--line-2)}
.sit h4{margin-bottom:8px}
.sit .row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.7fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:17px;line-height:1.45}
.sit .row .k{align-self:baseline}

/* 12 business */
.shape{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.shape div{padding:20px 22px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.shape p,.shape li{font-size:17px;line-height:1.5}
.shape ul{padding-left:18px;display:grid;gap:5px}
.shape .win{background:var(--coral-wash);border-color:rgba(232,64,31,.3)}

/* 13 success */
.ns{display:grid;gap:12px}
@media(min-width:64rem){.ns{grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr))}}
.ns .tile.north{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ns .north .v{font-size:clamp(48px,7vw,104px);color:var(--coral)}
.ns .north .k{color:var(--paper);opacity:.8}
.ns .by{font:500 14px var(--mono);color:var(--ink-3)}

/* 14 FAQ */
.faq{display:grid;gap:24px}
@media(min-width:64rem){.faq{grid-template-columns:1fr 1fr}}
details.q{border-bottom:1px solid var(--line);padding:2px 0}
details.q>summary{cursor:pointer;list-style:none;display:flex;gap:12px;align-items:baseline;padding:14px 0;font:600 18.5px/1.35 var(--display);letter-spacing:-.01em}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::after{content:"+";margin-left:auto;font:700 20px var(--mono);color:var(--red);flex:none}
details.q[open]>summary::after{content:"−"}
details.q p{padding:0 0 16px;font-size:17.5px;line-height:1.55;color:var(--ink-2);max-width:60ch}
.risk{width:10px;height:10px;border-radius:50%;flex:none;align-self:center;background:var(--ok)}
.risk.med{background:var(--amber)}.risk.high{background:var(--red);animation:pulse 2.6s ease-in-out infinite}

/* 15 enablers */
.en{overflow-x:auto;padding-bottom:8px}
.en svg{display:block;min-width:760px;width:100%;height:auto}
.en text{font:500 15px var(--body);fill:var(--ink)}
.en .lane{font:600 14px var(--body);fill:var(--ink-3);letter-spacing:.05em}
.en .f{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.en .e{fill:var(--sunk);stroke:var(--line-2);stroke-width:1}
.en .edge{fill:none;stroke:var(--coral);stroke-width:2;stroke-dasharray:8 6;animation:flow 1.05s linear infinite;opacity:.75}
.en-list{display:grid;gap:10px;margin-top:18px}
.en-row{display:grid;gap:10px;padding:16px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.lanes{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));font-size:16px;line-height:1.45}
.lanes div{padding:10px 12px;border-radius:var(--r-sm);background:var(--sunk)}
.lanes .k{margin-bottom:4px}
.lanes .none{opacity:.5}

/* 16 assumptions */
.asm{display:grid;gap:10px}
.as{display:grid;gap:14px;padding:20px 24px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);grid-template-columns:auto 1fr;align-items:start}
.as.first{border:2px solid var(--coral);background:var(--coral-wash)}
.as .rank{font-family:var(--display);font-size:36px;font-weight:800;color:var(--red);line-height:1;letter-spacing:-.03em}
.as .claim{font:700 clamp(19px,2.1vw,24px)/1.25 var(--display);letter-spacing:-.015em}
.as .if{font-size:17px;color:var(--ink-2);margin-top:6px;line-height:1.5}
.as .test{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:16px;color:var(--ink-2)}

/* D pre-mortem */
.pm{display:grid;gap:18px}
@media(min-width:64rem){.pm{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.pm .obit{padding:28px 32px;border-radius:var(--r);background:var(--ink);color:var(--paper)}
.pm .obit .date{font:500 15px var(--mono);opacity:.65}
.pm .obit h3{margin-top:8px;color:var(--paper)}
.pm .obit p{margin-top:16px;font-size:18.5px;line-height:1.6;opacity:.92;max-width:60ch}
.pm .obit .inv{color:var(--amber);border-color:var(--amber)}
.causes{display:grid;gap:10px;align-content:start}
.cause{padding:16px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--red)}
.cause b{font:700 19px/1.3 var(--display);letter-spacing:-.01em;display:block}
.cause p{margin-top:5px;font-size:17px;color:var(--ink-2);line-height:1.5}
.drift{margin-top:22px;font:700 clamp(20px,2.4vw,28px)/1.3 var(--display);letter-spacing:-.02em;color:var(--ink-2);max-width:68ch}
.drift em{font-style:normal;color:var(--red)}

/* 17 path */
.path{position:relative;padding-left:40px;max-width:60rem}
.path::before{content:"";position:absolute;left:14px;top:14px;bottom:14px;width:4px;border-radius:2px;background:linear-gradient(var(--coral),var(--line-2))}
.rung{position:relative;padding:14px 20px 24px 0}
.rung::before{content:"";position:absolute;left:-33px;top:22px;width:18px;height:18px;border-radius:50%;background:var(--paper);border:4px solid var(--coral)}
.rung:first-child::before{background:var(--coral)}
.rung .top{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.rung h4{font-size:clamp(24px,2.8vw,34px);font-weight:800;letter-spacing:-.025em}
.rung .when{font:500 15px var(--mono);color:var(--ink-3)}
.rung p{margin-top:6px;font-size:18px;color:var(--ink-2);line-height:1.5;max-width:68ch}
.rung p b{color:var(--ink);font-weight:600}

footer{padding:56px 0 calc(40px + env(safe-area-inset-bottom));font-size:15px;color:var(--ink-3);display:grid;gap:6px;border-top:1px solid var(--line);margin-top:48px}

/* motion gates: nothing is hidden when motion is off */
.gs,.stg>*{opacity:1}
html[data-motion="off"] .gs,html[data-motion="off"] .stg>*{opacity:1!important;transform:none!important}
</style>

const head = (id, title, lede, k) => `<div class="sec-head gs"><span class="eyebrow"><span class="n">${String(num(id)).padStart(2, "0")}</span>${esc(k)}</span><h2>${acc(title)}</h2>${lede ? `<p class="lede">${lede}</p>` : ""}</div>`;
const NOV = { standard: "standard practice", adapted: "adapted from elsewhere", new: "new: nobody does this" };

function render() {
  document.title = M.title;
  for (const [a, b] of [["brand-title", M.title], ["side-title", M.title], ["brand-mod", `${M.project} · ${M.module}`], ["side-mod", `${M.project} · ${M.module}`]]) document.getElementById(a).textContent = b;
  document.getElementById("toc").innerHTML = ON.map(id => `<a href="#${id}">${esc(NAMES[id])}</a>`).join("");
  document.getElementById("side-nav").innerHTML = ACTS.map(a => `<div class="act-h"><i>${esc(a.n.replace("Act ", ""))}</i>${esc(a.name)}</div>` + a.ids.filter(on).map(id => `<a href="#${id}"><span class="n">${String(num(id)).padStart(2, "0")}</span>${esc(NAMES[id])}</a>`).join("")).join("");

  const frames = (arr, after) => `<div class="strip ${after ? "after" : "before"} stg">${arr.map(f => `<div class="frame${f.hit ? " hit" : ""}"><span class="t"><span>${esc(f.t)}</span>${icon(f.icon)}</span><p>${esc(f.frame)}${flag(f)}</p></div>`).join("")}</div>`;
  const bb = s => `<div class="bb">${s.blocks.map(([l, n]) => `<div style="grid-column:span ${Math.min(12, Math.max(1, n | 0))}">${esc(l)}</div>`).join("")}</div>`;
  const lane = (k, a) => `<div class="${a && a.length ? "" : "none"}"><span class="k">${k}</span>${a && a.length ? esc(a.join(" · ")) : "—"}</div>`;

  // enabler diagram geometry
  const EN = V.enablers || [], LANES = ["data", "tech", "hardware", "integrations", "partners", "people", "regulation"];
  const rowH = 60, H = Math.max(EN.length, LANES.length) * rowH + 40, fx = 20, fw = 400, lx = 680, lw = 180;
  const edges = EN.flatMap((e, i) => LANES.map((k, j) => (e[k] && e[k].length) ? `<path class="edge" d="M${fx + fw} ${40 + i * rowH + 20} C ${lx - 90} ${40 + i * rowH + 20}, ${lx - 90} ${40 + j * rowH + 20}, ${lx} ${40 + j * rowH + 20}"/>` : "").filter(Boolean));
  const enSvg = `<svg viewBox="0 0 ${lx + lw + 20} ${H}" role="img" aria-label="Which enablers each core feature needs">
    ${edges.join("")}
    ${EN.map((e, i) => `<rect class="f" x="${fx}" y="${40 + i * rowH}" width="${fw}" height="40" rx="10"/><text x="${fx + 14}" y="${40 + i * rowH + 25}">${esc(e.feature.length > 46 ? e.feature.slice(0, 45) + "…" : e.feature)}</text>`).join("")}
    ${LANES.map((k, j) => `<rect class="e" x="${lx}" y="${40 + j * rowH}" width="${lw}" height="40" rx="10"/><text class="lane" x="${lx + 14}" y="${40 + j * rowH + 25}">${k.toUpperCase()}</text>`).join("")}
    <text class="lane" x="${fx}" y="22">CORE FEATURES</text><text class="lane" x="${lx}" y="22">MUST EXIST FIRST</text></svg>`;

  // at a glance: the whole vision on one screen
  const north = V.success.northStar, primary = V.personas.find(p => p.role === "primary") || V.personas[0] || {};
  const core = (V.features || []).flatMap(m => (m.items || []).filter(f => f.tier === "core").map(f => f.name));
  const top = (V.assumptions || [])[0] || {}, first = (V.path || []).at(-1) || {}, target = (V.magic.ladder || []).find(r => r.target);
  const P = V.problem || { units: [] }, newUnits = P.units.filter(u => u.novelty === "new").length;
  const glance = `
    <div class="glance-title gs"><h3>At a glance</h3><span>the whole vision on one screen</span></div>
    <div class="glance stg">
      <div class="cell dark wide"><span class="k">the problem</span><p class="big" style="font-size:clamp(20px,2.2vw,27px)">${esc(P.big || "")}</p><p style="opacity:.8">${P.units.length} atomic units · ${newUnits} solved with something nobody does</p></div>
      <div class="cell hot wide"><span class="k">the magic moment</span><p class="big" style="font-size:clamp(22px,2.4vw,30px)">${esc(V.magic.moment)}</p></div>
      <div class="cell"><span class="k">for</span><p><b>${esc(primary.name || "")}</b></p><p style="color:var(--ink-2)">${esc(primary.situation || "")}</p></div>
      <div class="cell"><span class="k">north star</span><span class="v">${esc(north.target)}</span><p>${esc(north.name)}</p></div>
      <div class="cell"><span class="k">core, ${core.length} features</span><ul>${core.slice(0, 6).map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>
      <div class="cell"><span class="k">lives in</span><ul>${(V.surfaces || []).map(s => `<li>${esc(s.name)} <span style="color:var(--ink-3)">· ${esc(s.kind)}</span></li>`).join("")}</ul></div>
      <div class="cell"><span class="k">who pays</span><p>${esc(V.business.payer)}</p><p style="color:var(--ink-2)">${esc(V.business.pricing)}</p></div>
      <div class="cell"><span class="k">riskiest assumption</span><p>${esc(top.claim || "")}</p><p style="color:var(--ink-2)">test: ${esc(top.pretotype || "")}, ${esc(top.cost || "")}</p></div>
      <div class="cell"><span class="k">we build the ${target ? target.star + "★" : ""} rung</span><p>${esc(target ? target.text : "")}</p></div>
      <div class="cell"><span class="k">first step: ${esc(first.rung || "")} · ${esc(first.when || "")}</span><p>${esc(first.proves || "")}</p></div>
    </div>`;

  // every section, keyed by id; the acts decide the order
  const S = {};
  S.problem = `<section class="s" id="problem">${head("problem", "The problem, atomised", "The exact problem first, then broken into tangible units. Each unit gets the most novel solution we can defend; the novelty budget goes where it changes the outcome.", "problem")}
    <div class="prob">
      <div class="bigp gs"><span class="k">the problem, exactly</span><p class="big">${esc(P.big || "")}</p>${P.costs ? `<p style="margin-top:12px;font-size:18px;opacity:.85">What it costs: ${esc(P.costs)}</p>` : ""}${flag(P)}</div>
      <div class="tally gs"><span><b>${P.units.length}</b> atomic units</span><span><b style="color:var(--red)">${newUnits}</b> solved with something new</span><span><b style="color:var(--amber)">${P.units.filter(u => u.novelty === "adapted").length}</b> adapted from elsewhere</span><span><b style="color:var(--ink-3)">${P.units.filter(u => u.novelty === "standard").length}</b> standard practice</span></div>
      <div class="units stg">${P.units.map((u, i) => `<div class="unit ${esc(u.novelty)}"><span class="num">${i + 1}</span><div><h4>${esc(u.unit)}${flag(u)}</h4><p class="today">Today: ${esc(u.today)}</p></div><div class="sol-wrap"><p class="sol">${esc(u.solution)}</p>${u.why ? `<p class="why">${esc(u.why)}</p>` : ""}</div><div class="nov ${esc(u.novelty)}"><span class="k">novelty</span><span class="dots"><i></i><i></i><i></i></span><span class="lbl">${esc(NOV[u.novelty] || u.novelty)}</span></div></div>`).join("")}</div>
    </div>
  </section>`;
  S.who = `<section class="s" id="who">${head("who", "Who it is for", "The user, the second user, the buyer, and the one we turn away.", "personas")}
    <div class="grid g4 stg">${(V.personas || []).map(p => `<div class="card persona ${p.role}"><div class="role"><span class="chip">${esc(p.role)}</span>${flag(p)}</div><h4>${esc(p.name)}</h4>
      <dl><dt>situation</dt><dd>${esc(p.situation)}</dd><dt>today</dt><dd>${esc(p.today)}</dd><dt>${p.role === "anti" ? "why not" : "switch trigger"}</dt><dd>${esc(p.trigger)}</dd></dl></div>`).join("")}</div>
  </section>`;
  S.jobs = `<section class="s" id="jobs">${head("jobs", "Jobs to be done", "“When …, I want …, so I can …”. The bar is how much the job matters.", "jobs")}
    <div class="jobs stg">${(V.jobs || []).map(j => `<div class="job ${j.type}"><div class="row"><span class="rank">${j.rank}</span><p class="story">${esc(j.story)}${flag(j)}</p><span class="type">${esc(j.type)}</span></div><div class="bar"><i style="width:${Math.max(2, Math.min(100, j.weight | 0))}%"></i></div></div>`).join("")}</div>
  </section>`;
  S.today = `<section class="s" id="today">${head("today", "A day today", "The primary user's day as it is now, frame by frame. This is the day the product has to change.", "storyboard · before")}
    ${frames(V.day.before, false)}<p class="strip-note">Scroll sideways. The same day, with the finished product, opens Act II.</p>
  </section>`;
  S.press = `<section class="s" id="press">${head("press", "Launch day, written first", "If this release would not make the primary user want it, the idea is not ready.", "press release")}
    <div class="pr">
      <article class="paper gs"><span class="date">${esc(V.pressRelease.date)}${flag(V.pressRelease)}</span><h3>${esc(V.pressRelease.headline)}</h3><p class="sub">${esc(V.pressRelease.sub)}</p>
        <div class="body">${(V.pressRelease.body || []).map(p => `<p>${esc(txt(p))}${flag(p)}</p>`).join("")}</div></article>
      <div class="quotes stg">
        <div class="quote"><p>“${esc(V.pressRelease.quoteFounder)}”</p><span class="k">founder</span></div>
        <div class="quote"><p>“${esc(V.pressRelease.quoteUser)}”</p><span class="k">${esc(primary.name || "user")}</span></div>
      </div>
    </div>
  </section>`;
  S.magic = `<section class="s" id="magic">${head("magic", "The magic moment", "The first “oh, this is good”, the loop that brings them back, and the 11-star ladder: pushed to absurd, then the rung we build.", "magic moment")}
    <div class="magic">
      <div class="moment gs"><span class="k">the moment</span><p class="big">${esc(V.magic.moment)}${flag(V.magic)}</p></div>
      <div class="loop gs"><svg viewBox="0 0 360 360" role="img" aria-label="Core loop: ${esc(V.magic.loop.join(', '))}">
        <circle class="ring" cx="180" cy="180" r="120"/>
        ${V.magic.loop.map((l, i) => { const a = -Math.PI / 2 + i * Math.PI / 2, x = 180 + 120 * Math.cos(a), y = 180 + 120 * Math.sin(a); return `<circle class="node" cx="${x}" cy="${y}" r="44"/><text x="${x}" y="${y + 5}" text-anchor="middle">${esc(l)}</text>`; }).join("")}
      </svg></div>
    </div>
    <div class="ladder stg">${(V.magic.ladder || []).map(r => `<div class="${r.target ? "target" : ""}"><span class="star">${r.star}★</span><span>${esc(r.text)}${flag(r)}</span></div>`).join("")}</div>
  </section>`;
  S.finished = `<section class="s" id="finished">${head("finished", "The same day, finished", "The day from Act I again, with the product in it. Highlighted frames are where it appears; the rest is the person's life.", "storyboard · after")}
    ${frames(V.day.after, true)}
  </section>`;
  S.first = V.firstMinutes ? `<section class="s" id="first">${head("first", "The first five minutes", "From the first touch to the magic moment, with the clock running.", "time to magic")}
    <div class="fm gs">${V.firstMinutes.map(s => `<div class="step${s.magic ? " magic" : ""}"><span class="t">${esc(s.t)}</span><p>${esc(s.step)}${flag(s)}</p></div>`).join("")}</div>
  </section>` : "";
  S.uses = `<section class="s" id="uses">${head("uses", "Use cases", "Each one walked in slow motion: what starts it, the steps, the payoff, and what happens when it goes wrong.", "use cases")}
    <div class="gs">${(V.useCases || []).map(u => `<details class="uc"><summary><span class="id">${esc(u.id)}</span><span class="st">${esc(u.story)}${flag(u)}</span></summary>
      <div class="uc-body"><div><span class="k">trigger</span><p>${esc(u.trigger)}</p><span class="k">steps</span><ol>${li(u.steps)}</ol><span class="k">payoff</span><p>${esc(u.payoff)}</p></div>
      <div><div class="fail"><b>When it goes wrong</b><ul>${li(u.fails)}</ul></div><p style="margin-top:12px"><span class="k">serves jobs</span> ${(u.jobs || []).map(n => `<span class="badge">#${n}</span>`).join(" ")}</p></div></div></details>`).join("")}</div>
  </section>`;
  S.surfaces = `<section class="s" id="surfaces">${head("surfaces", "Surfaces and screens", "What is on each screen and how much room it takes, drawn too thick to argue about pixels.", "surfaces")}
    <div class="tabs" role="tablist">${(V.surfaces || []).map((s, i) => `<button role="tab" aria-selected="${i === 0}" aria-controls="surf-${i}" id="tab-${i}">${esc(s.name)} <span class="kind">${esc(s.kind)}</span></button>`).join("")}</div>
    ${(V.surfaces || []).map((s, i) => `<div class="screens" role="tabpanel" id="surf-${i}" aria-labelledby="tab-${i}" ${i ? "hidden" : ""}>${(s.screens || []).map(sc => `<div class="screen"><h4>${esc(sc.name)}${flag(sc)}</h4>${bb(sc)}${sc.note ? `<p class="note">${esc(sc.note)}</p>` : ""}</div>`).join("")}</div>`).join("")}
  </section>`;
  S.physical = V.physical ? `<section class="s" id="physical">${head("physical", "The physical form", "The box, the install, and the site with it in.", "physical form")}
    <div class="phys stg">
      <div class="cell"><span class="k">form</span><p class="dims">${esc(V.physical.dims || "")}</p><p>${esc(V.physical.form)}${flag(V.physical)}</p></div>
      <div class="cell"><span class="k">install</span><ul>${li(V.physical.install)}</ul></div>
      <div class="cell"><span class="k">the site with it in</span><p>${esc(V.physical.site)}</p></div>
      <div class="cell"><span class="k">senses</span><ul>${li(V.physical.senses)}</ul></div>
    </div>
  </section>` : "";
  S.features = `<section class="s" id="features">${head("features", "The feature map", "Grouped by module, each tied to a job. Core cannot be cut; Complete is the mature product; Delight is the 7★ rung.", "features")}
    <div class="legend gs"><span class="tier core">core</span><span class="tier complete">complete</span><span class="tier delight">delight</span><span><span class="badge">#n</span> = job served</span></div>
    <div class="mods stg">${(V.features || []).map(m => `<div class="mod"><h4>${esc(m.module)}</h4><ul>${(m.items || []).map(f => `<li class="feat"><span class="tier ${f.tier}">${esc(f.tier)}</span><span>${esc(f.name)}${flag(f)}</span><span class="badge">#${f.job}</span></li>`).join("")}</ul></div>`).join("")}</div>
  </section>`;
  S.decisions = V.decisions ? `<section class="s" id="decisions">${head("decisions", "Decision rights", "What it does on its own, what it asks first, and what it never does without a human.", "decision rights")}
    <div class="dr stg">
      <div class="col auto"><h4>Does on its own</h4><ul>${li(V.decisions.auto)}</ul></div>
      <div class="col ask"><h4>Asks first</h4><ul>${li(V.decisions.ask)}</ul></div>
      <div class="col never"><h4>Never without a human</h4><ul>${li(V.decisions.never)}</ul>${flag(V.decisions)}</div>
    </div>
  </section>` : "";
  S.nogos = `<section class="s" id="nogos">${head("nogos", "What it will never do", "The fence. Each no-go has a reason, so the next feature request meets an argument, not a mood.", "no-gos")}
    <ul class="nogo stg">${(V.noGos || []).map(n => `<li><span>${esc(txt(n))}${n.why ? `<small>${esc(n.why)}${flag(n)}</small>` : flag(n)}</span></li>`).join("")}</ul>
  </section>`;
  S.feel = `<section class="s" id="feel">${head("feel", "How it feels, and the hard numbers", "Qualities in words; constraints as numbers, because numbers decide the architecture.", "qualities")}
    <div class="feels stg">${(V.qualities.feels || []).map(f => `<span>${esc(txt(f))}${flag(f)}</span>`).join("")}</div>
    <div class="tiles stg">${(V.qualities.hard || []).map(h => `<div class="tile"><span class="v">${esc(h.v)}</span><span class="k">${esc(h.k)}</span>${flag(h)}</div>`).join("")}</div>
  </section>`;
  S.ideal = V.ideal ? `<section class="s" id="ideal">${head("ideal", "Who they become", "The same person, with the product fully absorbed. The product wins by making them better at the thing, not by being admired.", "ideal user")}
    <div class="ideal stg">
      <div class="card was"><span class="k">was</span><ul>${li(V.ideal.was)}</ul></div>
      <div class="card portrait"><span class="k">${esc(V.ideal.name)}${flag(V.ideal)}</span><p class="big">${esc(V.ideal.becomes)}</p><p class="says">“${esc(V.ideal.says)}”</p></div>
      <div class="card now"><span class="k">now</span><ul>${li(V.ideal.now)}</ul></div>
    </div>
  </section>` : "";
  S.situation = V.situation ? `<section class="s" id="situation">${head("situation", "Where it shines, what it survives", "The ideal situation, where the product is most itself, next to the worst realistic one it still has to work in.", "situation")}
    <div class="sit stg">
      <div class="col shine"><h4>Where it shines</h4>${(V.situation.shines || []).map(r => `<div class="row"><span class="k">${esc(r.k)}</span><span>${esc(r.v)}${flag(r)}</span></div>`).join("")}</div>
      <div class="col survive"><h4>What it must survive</h4>${(V.situation.survives || []).map(r => `<div class="row"><span class="k">${esc(r.k)}</span><span>${esc(r.v)}${flag(r)}</span></div>`).join("")}</div>
    </div>
  </section>` : "";
  S.business = `<section class="s" id="business">${head("business", "The business shape", "Who pays, how, how it spreads, what it replaces, and why it wins.", "business")}
    <div class="shape stg">
      <div><span class="k">who pays</span><p>${esc(V.business.payer)}</p>${flag(V.business)}</div>
      <div><span class="k">pricing</span><p>${esc(V.business.pricing)}</p></div>
      <div><span class="k">distribution</span><p>${esc(V.business.distribution)}</p></div>
      <div><span class="k">alternatives</span><ul>${li(V.business.alternatives)}</ul></div>
      <div class="win"><span class="k">why we win</span><ul>${li(V.business.whyWin)}</ul></div>
    </div>
  </section>`;
  S.success = `<section class="s" id="success">${head("success", "What success looks like", "One north star, two or three supporting numbers, each with a date.", "metrics")}
    <div class="ns stg">
      <div class="tile north"><span class="v num">${esc(north.target)}</span><span class="k">${esc(north.name)}</span>${flag(north)}</div>
      ${(V.success.metrics || []).map(m => `<div class="tile"><span class="v num">${esc(m.target)}</span><span class="k">${esc(m.name)}</span><span class="by">by ${esc(m.by)}</span>${flag(m)}</div>`).join("")}
    </div>
  </section>`;
  S.people = V.people ? `<section class="s" id="people">${head("people", "The ideal people", "Not users: the people the product needs around it. Who they are, what they bring, who is not a fit, and where to find them.", "ideal people")}
    <div class="grid g3 stg">${V.people.map(p => `<div class="card person"><div class="role"><span class="chip">${esc(p.role)}</span>${flag(p)}</div><h4>${esc(p.title)}</h4>
      <p class="why">${esc(p.why)}</p>
      <dl><dt>brings</dt><dd><ul>${li(p.brings)}</ul></dd><dt>not a fit</dt><dd>${esc(p.notFit)}</dd><dt>where to find them</dt><dd>${esc(p.where)}</dd></dl></div>`).join("")}</div>
  </section>` : "";
  S.faq = `<section class="s" id="faq">${head("faq", "Questions, outside and inside", "Outside: what a customer would ask. Inside: what we are assuming without proof, with a risk dot.", "faq")}
    <div class="faq gs">
      <div><span class="k" style="margin-bottom:6px">external</span>${(V.faq.external || []).map(q => `<details class="q"><summary>${esc(q.q)}${flag(q)}</summary><p>${esc(q.a)}</p></details>`).join("")}</div>
      <div><span class="k" style="margin-bottom:6px">internal</span>${(V.faq.internal || []).map(q => `<details class="q"><summary><span class="risk ${q.risk || "low"}" title="risk ${esc(q.risk || "low")}"></span>${esc(q.q)}${flag(q)}</summary><p>${esc(q.a)}</p></details>`).join("")}</div>
    </div>
  </section>`;
  S.enablers = `<section class="s" id="enablers">${head("enablers", "What must exist first", "For every Core feature: the data, tech, hardware, integrations, partners, people and regulation it stands on. The start of the engineering plan.", "enabler map")}
    <div class="en gs">${enSvg}</div>
    <div class="en-list stg">${EN.map(e => `<div class="en-row"><h4>${esc(e.feature)}${flag(e)}</h4><div class="lanes">${LANES.map(k => lane(k, e[k])).join("")}</div></div>`).join("")}</div>
  </section>`;
  S.risks = `<section class="s" id="risks">${head("risks", "The riskiest assumptions", "Ranked. Each with what breaks if it is wrong and the cheapest test that could prove it wrong.", "assumptions")}
    <div class="asm stg">${(V.assumptions || []).map((a, i) => `<div class="as ${i === 0 ? "first" : ""}"><span class="rank">${a.rank}</span><div><p class="claim">${esc(a.claim)}${flag(a)}</p><p class="if"><b>If wrong:</b> ${esc(a.ifWrong)}</p><div class="test"><span class="chip">${esc(a.pretotype)}</span><span>${esc(a.cost)}</span></div></div></div>`).join("")}</div>
  </section>`;
  S.premortem = V.premortem ? `<section class="s" id="premortem">${head("premortem", "The pre-mortem", "It is two years on and the product is dead. The obituary first, then the causes, then the version it drifted into.", "pre-mortem")}
    <div class="pm">
      <article class="obit gs"><span class="date">${esc(V.premortem.date)}</span><h3>${esc(V.premortem.headline)}${flag(V.premortem)}</h3><p>${esc(V.premortem.obituary)}</p></article>

  S.path = `<section class="s" id="path">${head("path", "The path backwards", "The end product on top, the first demo at the bottom, and what each rung proves. Read upwards, it is the roadmap.", "path")}
    <div class="path gs">${(V.path || []).map(r => `<div class="rung"><div class="top"><h4>${esc(r.rung)}</h4><span class="when">${esc(r.when || "")}</span>${flag(r)}</div><p><b>Proves:</b> ${esc(r.proves)}</p></div>`).join("")}</div>
  </section>`;

  document.getElementById("top").innerHTML = `
  <section class="hero" id="what">
    <span class="eyebrow gs"><i></i>${esc(M.project)} · ${esc(M.module)} · end-product vision · ${esc(M.date)}</span>
    <h1 class="gs">${acc(M.title)}</h1>
    <p class="line big gs">${esc(V.oneLiner.line)}</p>
    <div class="two-years gs"><span class="k">In two years</span><p>${esc(M.twoYears.replace(/^In two years,?\s*/i, ""))}</p></div>
    ${glance}
    <div class="isnot stg" style="margin-top:12px">
      <div><span class="k">It is</span><ul>${li(V.oneLiner.is)}</ul></div>
      <div class="no"><span class="k">It is not</span><ul>${li(V.oneLiner.isNot)}</ul></div>
    </div>
  </section>
  ${ACTS.map(a => `<div class="act gs" id="act-${a.n.split(" ")[1].toLowerCase()}"><span class="n">${esc(a.n)}</span><h2>${acc(a.name)}</h2><p>${esc(a.q)}</p></div>` + a.ids.filter(on).map(id => S[id]).join("")).join("")}`;

  const inv = document.querySelectorAll(".inv").length;
  document.getElementById("foot").innerHTML = `<span>${esc(M.project)} · ${esc(M.module)} · ${esc(M.date)}</span><span>${inv} invented fact${inv === 1 ? "" : "s"} flagged ✦ · sources read: ${esc((M.sources || []).join(", ") || "none")}</span><span>source folder ${esc(M.source)}</span>`;

  // tabs
  document.querySelectorAll('[role="tab"]').forEach(t => t.addEventListener("click", () => {
    document.querySelectorAll('[role="tab"]').forEach(x => x.setAttribute("aria-selected", x === t));
    document.querySelectorAll(".screens").forEach(p => p.hidden = p.id !== t.getAttribute("aria-controls"));
  }));
  // section highlight in both navs
  const links = [...document.querySelectorAll("#toc a, #side-nav a")];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(l => l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id)); }), { rootMargin: "-30% 0px -60% 0px" });
  ON.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
}

/* ---------- settings ---------- */
const root = document.documentElement;
const save = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function syncButtons() {
  document.getElementById("btn-theme").setAttribute("aria-pressed", root.dataset.theme === "dark");
  document.getElementById("btn-theme").textContent = root.dataset.theme === "dark" ? "dark" : "light";
  document.getElementById("btn-motion").setAttribute("aria-pressed", root.dataset.motion !== "off");
  document.getElementById("btn-motion").textContent = root.dataset.motion === "off" ? "motion off" : "motion on";
}
document.getElementById("btn-theme").addEventListener("click", () => { root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark"; save("arth-theme", root.dataset.theme); syncButtons(); });
document.getElementById("btn-motion").addEventListener("click", () => { root.dataset.motion = root.dataset.motion === "off" ? "on" : "off"; save("arth-motion", root.dataset.motion); location.reload(); });

/* ---------- motion (GSAP), only when data-motion="on"; subtle fades that never hide content ---------- */
function animate() {
  if (root.dataset.motion === "off" || !window.gsap) return;
  gsap.registerPlugin(ScrollTrigger);
  gsap.utils.toArray(".gs").forEach(el => gsap.from(el, { opacity: 0, y: MOTION.reveal.y, duration: MOTION.reveal.duration, ease: MOTION.reveal.ease, scrollTrigger: { trigger: el, start: MOTION.reveal.start, toggleActions: "play none none none" } }));
  gsap.utils.toArray(".stg").forEach(el => gsap.from(el.children, { opacity: 0, y: MOTION.stagger.y, duration: MOTION.stagger.duration, ease: MOTION.stagger.ease, stagger: MOTION.stagger.each, scrollTrigger: { trigger: el, start: "top 88%" } }));
  // counter tween on big numbers that contain a plain integer
  gsap.utils.toArray(".num").forEach(el => { const m = el.textContent.match(/^(\D*)(\d+)(.*)$/); if (!m || m[2].length > 4) return; const o = { n: 0 }; gsap.to(o, { n: +m[2], duration: 1, ease: "power2.out", scrollTrigger: { trigger: el, start: "top 90%" }, onUpdate: () => el.textContent = m[1] + Math.round(o.n) + m[3] }); });
}
render(); syncButtons(); addEventListener("load", animate);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
