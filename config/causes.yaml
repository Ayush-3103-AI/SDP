# CAXTON taxonomy (ADR-0009, 07 §15); frozen by T-0007.
causes:
  - none
  - flow_low
  - flow_high
  - speed_low
  - speed_high
  - nozzle_temp_low
  - nozzle_temp_high
  - z_offset_low
  - z_offset_high

cause_action:
  flow_low: [flow, -1]
  flow_high: [flow, 1]
  speed_low: [speed, -1]
  speed_high: [speed, 1]
  nozzle_temp_low: [nozzle_temp, -1]
  nozzle_temp_high: [nozzle_temp, 1]
  none: null
  z_offset_low: null
  z_offset_high: null

# Manual causes: every cause with a null action except `none` needs advice. misalignment is not a
# cause any more but stays manual (the integrating team's detector may emit it).
manual_advice:
  z_offset_low: "Nozzle likely too close to the bed: raise the Z offset (babystep up ~0.05 mm) or re-level."
  z_offset_high: "Nozzle likely too far from the bed: lower the Z offset (babystep down ~0.05 mm) or re-level."
  misalignment: "Possible layer shift: check belts and pulleys before resuming."

# [assumed] physics prior (card text, detector-class audit); not used for labels.
cause_defects:
  nozzle_temp_high:
    - stringing
    - over_extrusion
  nozzle_temp_low:
    - under_extrusion
    - clog
  flow_high:
    - over_extrusion
  flow_low:
    - under_extrusion
  speed_high:
    - under_extrusion
  speed_low:
    - over_extrusion
    - stringing
  z_offset_low:
    - over_extrusion
  z_offset_high:
    - under_extrusion
    - warping

deck_recipes:
  over_extrusion:
    nozzle_temp: 190
    speed: 95
    flow: 80

  under_extrusion:
    nozzle_temp: 205
    speed: 80
    flow: 110

  stringing:
    nozzle_temp: 190
    speed: 80
    flow: 95

  warping:
    bed_temp: 65